<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواقيت الصلاة والطقس في الشرقاط</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1a2e">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* الشاشة الافتتاحية باستخدام صورة splash.jpg */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #080f1a url('splash.jpg') no-repeat center center/cover;
            z-index: 99999;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        body {
            background: #080f1a url('https://images.unsplash.com/photo-1542816417-0983cbe82752?q=80&w=1000&auto=format&fit=crop') no-repeat center top/cover fixed;
            color: #ffffff;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(8, 15, 26, 0.75) 0%, rgba(8, 15, 26, 0.95) 100%);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .header {
            text-align: center;
            margin-top: 10px;
        }
        .header h2 {
            font-size: 1.1rem;
            color: #a0aec0;
            font-weight: 500;
        }
        .header h1 {
            font-size: 2.2rem;
            color: #ffffff;
            font-weight: 900;
        }

        .clock-card {
            background: rgba(16, 30, 50, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .clock-display {
            font-size: 2.8rem;
            font-weight: 800;
            color: #ffffff;
            font-family: monospace;
            direction: ltr;
        }
        .designer-sub {
            margin-top: 6px;
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: 600;
        }

        .date-card {
            background: rgba(16, 30, 50, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .next-prayer-card {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.7) 0%, rgba(16, 185, 129, 0.4) 100%);
            border: 1px solid rgba(52, 211, 153, 0.3);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .next-prayer-info h3 { font-size: 0.8rem; color: #a7f3d0; }
        .next-prayer-info h2 { font-size: 1.5rem; color: #ffffff; }
        .countdown { font-size: 1.4rem; font-weight: 800; font-family: monospace; direction: ltr; }

        .prayers-section {
            background: rgba(16, 30, 50, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 12px;
        }
        .section-title { font-size: 0.9rem; color: #38bdf8; margin-bottom: 10px; }
        .prayers-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
        .p-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 8px 2px;
            text-align: center;
        }
        .p-box.active { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; }
        .p-icon { font-size: 1.1rem; }
        .p-name { font-size: 0.7rem; color: #94a3b8; }
        .p-time { font-size: 0.75rem; font-weight: 700; direction: ltr; }

        .weather-card {
            background: rgba(16, 30, 50, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 15px;
        }
        .weather-main { display: flex; justify-content: space-between; align-items: center; }
        .temp-display { font-size: 3rem; font-weight: 900; }
        .city { font-size: 1rem; font-weight: 700; color: #38bdf8; }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            font-size: 0.7rem;
        }

        .footer {
            text-align: center;
            font-size: 0.8rem;
            color: #64748b;
            margin: 10px 0 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="splashScreen"></div>

    <div class="overlay"></div>
    <div class="container">
        <div class="header">
            <h2>مواقيت الصلاة والطقس</h2>
            <h1>في الشرقاط</h1>
        </div>

        <div class="clock-card">
            <div class="clock-display" id="clock">12:00:00 ص</div>
            <div class="designer-sub">تصميم محمد علي احمد الحطاب الجبوري</div>
        </div>

        <div class="date-card">
            <div id="gregorianDate">📅 جاري التحميل...</div>
            <div id="hijriDate">🌙 جاري التحميل...</div>
        </div>

        <div class="next-prayer-card">
            <div class="next-prayer-info">
                <h3>الصلاة القادمة</h3>
                <h2 id="nextPrayerName">--</h2>
            </div>
            <div class="countdown" id="countdown">00:00:00</div>
        </div>

        <div class="prayers-section">
            <div class="section-title">🕌 مواقيت الصلاة اليوم</div>
            <div class="prayers-grid" id="prayersGrid"></div>
        </div>

        <div class="weather-card">
            <div class="weather-main">
                <div>
                    <div class="city">📍 الشرقاط</div>
                    <div style="font-size: 0.85rem; color:#cbd5e1;">مشمس / صافي</div>
                </div>
                <div class="temp-display" id="temp">--°</div>
            </div>
            <div class="forecast-grid" id="forecastGrid"></div>
        </div>

        <div class="footer">
            تصميم محمد علي احمد الحطاب الجبوري
        </div>
    </div>

    <script>
        // إخفاء الشاشة الافتتاحية بعد 2.5 ثانية
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.visibility = 'hidden', 600);
            }, 2500);
        });

        let prayerTimes = {};

        // تحويل أوقات الصلاة القادمة من API (مثل 15:42) إلى نظام 12 ساعة (3:42)
        function format12Hour(timeStr) {
            if (!timeStr) return '';
            let [hours, minutes] = timeStr.split(':');
            hours = parseInt(hours, 10);
            hours = hours % 12;
            hours = hours ? hours : 12; // تحويل 0 إلى 12
            return `${hours}:${minutes}`;
        }

        // تحديث الساعة الرئيسية
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'م' : 'ص';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 

            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds} ${ampm}`;

            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('gregorianDate').textContent = `📅 ${now.toLocaleDateString('ar-IQ', options)}`;
            updateCountdown();
        }
        setInterval(updateClock, 1000);
        updateClock();

        fetch('https://api.aladhan.com/v1/timingsByCity?city=Shirqat&country=Iraq&method=3')
            .then(res => res.json())
            .then(data => {
                const t = data.data.timings;
                prayerTimes = t;
                const h = data.data.date.hijri;
                document.getElementById('hijriDate').textContent = `🌙 ${h.day} ${h.month.ar} ${h.year} هـ`;

                const pList = [
                    { key: 'Fajr', name: 'الفجر', icon: '🌅', time: format12Hour(t.Fajr) },
                    { key: 'Sunrise', name: 'الشروق', icon: '☀️', time: format12Hour(t.Sunrise) },
                    { key: 'Dhuhr', name: 'الظهر', icon: '🌤️', time: format12Hour(t.Dhuhr) },
                    { key: 'Asr', name: 'العصر', icon: '🌥️', time: format12Hour(t.Asr) },
                    { key: 'Maghrib', name: 'المغرب', icon: '🌅', time: format12Hour(t.Maghrib) },
                    { key: 'Isha', name: 'العشاء', icon: '🌙', time: format12Hour(t.Isha) }
                ];

                let html = '';
                pList.forEach(p => {
                    html += `
                        <div class="p-box" id="p-${p.key}">
                            <div class="p-icon">${p.icon}</div>
                            <div class="p-name">${p.name}</div>
                            <div class="p-time">${p.time}</div>
                        </div>
                    `;
                });
                document.getElementById('prayersGrid').innerHTML = html;
                updateCountdown();
            });

        function updateCountdown() {
            if (!prayerTimes.Fajr) return;
            const now = new Date();
            const list = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
            const names = { Fajr: 'صلاة الفجر', Dhuhr: 'صلاة الظهر', Asr: 'صلاة العصر', Maghrib: 'صلاة المغرب', Isha: 'صلاة العشاء' };

            let nextP = null;
            let nextPTime = null;

            for (let key of list) {
                const [h, m] = prayerTimes[key].split(':');
                const pDate = new Date();
                pDate.setHours(parseInt(h), parseInt(m), 0, 0);

                if (pDate > now) {
                    nextP = key;
                    nextPTime = pDate;
                    break;
                }
            }

            if (!nextP) {
                const [h, m] = prayerTimes['Fajr'].split(':');
                nextPTime = new Date();
                nextPTime.setDate(nextPTime.getDate() + 1);
                nextPTime.setHours(parseInt(h), parseInt(m), 0, 0);
                nextP = 'Fajr';
            }

            document.getElementById('nextPrayerName').textContent = names[nextP];
            document.querySelectorAll('.p-box').forEach(b => b.classList.remove('active'));
            const activeCard = document.getElementById(`p-${nextP}`);
            if (activeCard) activeCard.classList.add('active');

            const diff = nextPTime - now;
            const hrs = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('countdown').textContent = 
                `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        fetch('https://api.open-meteo.com/v1/forecast?latitude=35.4883&longitude=43.2389&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FBaghdad')
            .then(res => res.json())
            .then(data => {
                document.getElementById('temp').textContent = `${Math.round(data.current_weather.temperature)}°`;
                const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
                let fHtml = '';
                for (let i = 0; i < 5; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() + i);
                    fHtml += `
                        <div>
                            <div>${days[d.getDay()]}</div>
                            <div style="margin:2px 0;">☀️</div>
                            <div>${Math.round(data.daily.temperature_2m_max[i])}° / ${Math.round(data.daily.temperature_2m_min[i])}°</div>
                        </div>
                    `;
                }
                document.getElementById('forecastGrid').innerHTML = fHtml;
            });
    </script>
</body>
</html>
